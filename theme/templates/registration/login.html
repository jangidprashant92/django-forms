{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white shadow rounded p-6 space-y-4">
    <h1 class="text-2xl font-semibold text-center">Sign in</h1>
    {% if form.errors %}
      <div class="text-sm text-red-600">Invalid username or password.</div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div>
        <label class="block text-sm font-medium text-gray-700" for="id_username">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700" for="id_password">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded">Login</button>
    </form>
  </div>
</body>
</html>
